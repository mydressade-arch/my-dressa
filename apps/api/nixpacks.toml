[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

# Die App wendet ausstehende DB-Migrationen jetzt selbst beim Start an
# (siehe src/main.ts). Darum hier nur noch der normale Start — kein fragiles
# "&&"-Verketten mehr, das nicht zuverlässig an den Start übergeben hat.
[start]
cmd = "npm run start"
